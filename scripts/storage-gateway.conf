pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    # Nginx upstream errors include the original signed query string. Keep both
    # request and error logs disabled here; Web readiness reports availability.
    error_log /dev/null crit;
    limit_req_zone $binary_remote_addr zone=storage_rate:1m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=storage_connections:1m;
    server {
        listen 8080;
        client_max_body_size 32m;
        client_body_timeout 15s;
        client_header_timeout 10s;
        send_timeout 30s;
        limit_req_status 429;
        limit_conn_status 503;
        location / {
            # SGOL uses signed PUT, never HTML POST Object or multipart S3 POST.
            if ($request_method = POST) { return 405; }
            limit_req zone=storage_rate burst=120 nodelay;
            limit_conn storage_connections 32;
            proxy_pass http://127.0.0.1:8333;
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_read_timeout 30s;
            proxy_connect_timeout 3s;
        }
    }
}
