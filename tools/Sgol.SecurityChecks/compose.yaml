name: sgol-security-checks
services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_PASSWORD: ${SGOL_SECURITY_DB_PASSWORD:?Required}
    ports: ["127.0.0.1:5549:5432"]
    volumes: [security-db:/var/lib/postgresql]
    networks: [checks]
  storage:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command: [mini, -dir=/data, -ip=127.0.0.1, -ip.bind=127.0.0.1, -admin.ui=false, -webdav=false, -s3.port.iceberg=0, -s3.port.lance=0, -s3.iam=false, -s3.config=/run/secrets/storage-identities.json]
    ports: ["127.0.0.1:8339:8080"]
    volumes:
      - security-objects:/data
      - ${SGOL_SECURITY_STORAGE_CONFIG:?Required}:/run/secrets/storage-identities.json:ro
    networks: [checks]
  gateway:
    image: sgol-storage-gateway:security-20261028
    build:
      context: ../..
      dockerfile: tools/Sgol.SecurityChecks/storage-gateway.Dockerfile
    user: "101:101"
    network_mode: service:storage
    depends_on: [storage]
    volumes: [../../scripts/storage-gateway.conf:/etc/nginx/nginx.conf:ro]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  scanner:
    image: clamav/clamav:1.5.4-debian@sha256:be3cb41d9833ce9ffb98f3d3e1483c35c0d87060c2bda3624d75fd28bbf0b3bd
    ports: ["127.0.0.1:3319:3310"]
    volumes: [security-scanner:/var/lib/clamav]
    networks: [checks]
networks:
  checks: {internal: false}
volumes:
  security-db:
  security-objects:
  security-scanner:
