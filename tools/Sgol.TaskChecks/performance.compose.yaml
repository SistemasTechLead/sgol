name: sgol-performance
services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_DB: sgol_task_checks_performance
      POSTGRES_USER: sgol_perf
      POSTGRES_PASSWORD: ${SGOL_PERF_PASSWORD:?Use run-performance.ps1}
    ports: ["127.0.0.1:5547:5432"]
    mem_limit: 768m
    cpus: 1.0
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgol_perf -d sgol_task_checks_performance"]
      interval: 2s
      timeout: 2s
      retries: 30
  scanner:
    image: clamav/clamav:1.5.4-debian@sha256:cce3e1a43ae2bb40e11335c52c0e1e98273b12fa3d587e617f63a6907cc4b70b
    entrypoint: ["/usr/sbin/clamd", "--foreground=true", "--config-file=/etc/clamav/performance.conf"]
    ports: ["127.0.0.1:3347:3310"]
    cpus: 1.0
    mem_limit: 1536m
    volumes:
      - signatures:/var/lib/clamav:ro
      - ./performance-clamd.conf:/etc/clamav/performance.conf:ro
  storage:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: sgol-perf
      AWS_SECRET_ACCESS_KEY: ${SGOL_PERF_PASSWORD:?Use run-performance.ps1}
    ports: ["127.0.0.1:8347:8333"]
    cpus: 0.5
    mem_limit: 384m
    volumes: ["evidence:/data"]
volumes:
  database:
  evidence:
  signatures:
    external: true
    name: ${SGOL_PERF_SIGNATURE_VOLUME:?Set the existing signature volume for read-only access}
