name: Pull request gates

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character commit SHA for the isolated HU-035 network experiment
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: TECH-BASE-003 / PR gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Protect Fuentes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/verify-fuentes-protection.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

      - name: Require public repository for CV-05 artifact strategy
        if: github.head_ref == 'codex/tech-e2e-cv-05'
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPOSITORY_PRIVATE -ne 'false') { throw 'CV05_PUBLIC_REPOSITORY_REQUIRED' }
          if ($env:IMPLEMENTATION_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'CV05_EXACT_SHA_REQUIRED' }

      - name: Test CV-05 required and optional inventory cases
        if: github.head_ref == 'codex/tech-e2e-cv-05'
        shell: pwsh
        run: ./scripts/ci/test-cv05-evidence-inventory.ps1

      - name: Scan secrets with pinned Gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --no-color .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Validate portable operations contract
        shell: pwsh
        run: ./scripts/ci/validate-tech-ops.ps1

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify the .NET SDK version
        shell: bash
        run: |
          actual_version="$(dotnet --version)"
          if [[ "$actual_version" != "10.0.400" ]]; then
            echo "::error::Expected .NET SDK 10.0.400, found ${actual_version}."
            exit 1
          fi
          echo "PASS: .NET SDK ${actual_version}."

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Build Release with static analysis
        run: dotnet build --no-restore --configuration Release

      - name: Install browsers and Linux dependencies for TECH-FRONT-004 smoke
        shell: pwsh
        run: ./tests/Sgol.FrontendBrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium webkit

      - name: Run unit, architecture and PostgreSQL integration tests
        env:
          SGOL_EVIDENCE_EICAR_TESTS: "true"
        run: dotnet test --no-build --configuration Release --filter 'Category!=CV05_FOCUSED&Category!=FRONT_BROWSER'

      - name: TECH-FRONT-004 / isolated browser smoke
        run: dotnet test tests/Sgol.FrontendBrowserTests/Sgol.FrontendBrowserTests.csproj --no-build --configuration Release --filter 'Category=FRONT_BROWSER'

      - name: TECH-E2E-CV-04 / integral hosted demo
        shell: pwsh
        run: ./scripts/demo/run-cv04.ps1 -Mode Automated

      - name: Preserve sanitized TECH-E2E-CV-04 evidence
        if: always() && github.event.pull_request.number != 58 && github.head_ref != 'codex/tech-e2e-cv-05'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-e2e-cv-04-${{ env.IMPLEMENTATION_SHA }}
          path: .artifacts/cv04/latest/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized CV-04 evidence in free run summary and log
        if: success() && github.event.pull_request.number == 58
        shell: pwsh
        run: ./scripts/ci/publish-cv04-evidence.ps1 -ReportDirectory .artifacts/cv04/latest -ExpectedSha $env:IMPLEMENTATION_SHA

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Reject vulnerable direct or transitive packages
        shell: pwsh
        run: ./scripts/ci/Assert-NoVulnerablePackages.ps1

      - name: Build immutable OCI image with SBOM and provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          docker buildx create \
            --name sgol-ci \
            --driver docker-container \
            --use \
            --bootstrap
          if inspection="$(docker buildx inspect sgol-ci)"; then
            if ! grep -Eq '^Driver:[[:space:]]+docker-container$' <<< "$inspection"; then
              echo "::error::Buildx inspection succeeded but the expected docker-container driver was not found."
              exit 1
            fi
          else
            inspect_exit=$?
            echo "::error::docker buildx inspect failed with exit code ${inspect_exit}."
            exit "$inspect_exit"
          fi
          created="$(git show -s --format=%cI "$IMPLEMENTATION_SHA")"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VCS_REF=${IMPLEMENTATION_SHA}" \
            --build-arg "IMAGE_VERSION=pr-${IMPLEMENTATION_SHA::12}" \
            --build-arg "BUILD_CREATED=${created}" \
            --build-arg "SOURCE_DIRTY=false" \
            --tag "sgol:${IMPLEMENTATION_SHA}" \
            --load .
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VCS_REF=${IMPLEMENTATION_SHA}" \
            --build-arg "IMAGE_VERSION=pr-${IMPLEMENTATION_SHA::12}" \
            --build-arg "BUILD_CREATED=${created}" \
            --build-arg "SOURCE_DIRTY=false" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "$RUNNER_TEMP/sgol-oci-metadata.json" \
            --output "type=oci,dest=$RUNNER_TEMP/sgol-${IMPLEMENTATION_SHA}.oci.tar" .
          test -s "$RUNNER_TEMP/sgol-oci-metadata.json"
          test -s "$RUNNER_TEMP/sgol-${IMPLEMENTATION_SHA}.oci.tar"
          test "$(docker image inspect --format '{{.Config.User}}' "sgol:${IMPLEMENTATION_SHA}")" = "1654:1654"
          test "$(docker image inspect --format '{{index .Config.Labels "com.sgol.source.dirty"}}' "sgol:${IMPLEMENTATION_SHA}")" = "false"

      - name: Scan OCI image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sgol:${{ env.IMPLEMENTATION_SHA }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run integral TECH-OPS gate on native AMD64
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [Runtime.InteropServices.Architecture]::X64) {
            throw 'AMD64_HOST_REQUIRED: ubuntu-24.04 must resolve to an x64 runner.'
          }
          $imageRef = (docker image inspect --format '{{.Id}}' "sgol:$env:IMPLEMENTATION_SHA").Trim()
          ./scripts/operations/invoke-tech-ops-amd64-gate.ps1 `
            -ImageRef $imageRef `
            -GateRoot (Join-Path $env:RUNNER_TEMP 'sgol-tech-ops-amd64')

      - name: Dispose private TECH-OPS resources before HU-035
        if: always()
        shell: pwsh
        run: |
          $gateRoot = Join-Path $env:RUNNER_TEMP 'sgol-tech-ops-amd64'
          $runtime = Join-Path $gateRoot 'runtime-private/runtime.env'
          $containers = @(docker container ls --all --format '{{.Names}}')
          @('sgol-tech-ops-postgres','sgol-tech-ops-s3-source','sgol-tech-ops-s3-destination') |
            Where-Object { $containers -contains $_ } |
            ForEach-Object { docker container rm --force $_ | Out-Null }
          if (Test-Path -LiteralPath $runtime -PathType Leaf) {
            docker compose --env-file $runtime -f deploy/staging/compose.yaml down --remove-orphans
          }
          $networks = @(docker network ls --format '{{.Name}}')
          if ($networks -contains 'sgol-staging_private') {
            docker network rm sgol-staging_private | Out-Null
          }
          Remove-Item -LiteralPath (Join-Path $gateRoot 'runtime-private') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $gateRoot 'evidence-private') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run focused replica stream probe on native AMD64
        shell: pwsh
        run: |
          if (-not [Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([Runtime.InteropServices.OSPlatform]::Linux) -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [Runtime.InteropServices.Architecture]::X64) {
            throw 'AMD64_LINUX_HOST_REQUIRED'
          }
          $results = Join-Path $env:RUNNER_TEMP 'sgol-replica-stream-public'
          dotnet test tests/Sgol.OperationsIntegrationTests/Sgol.OperationsIntegrationTests.csproj `
            --configuration Release --no-restore -p:SGOL_TECH_OPS_EXTERNAL_TESTS=true `
            --filter 'FullyQualifiedName=Sgol.OperationsIntegrationTests.ReplicaStreamFocusedTests.ReplicaResponseStreamIsConditionallyWrittenAndVerified' `
            --results-directory $results --logger 'trx;LogFileName=replica-stream.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$trx = Get-Content -Raw -LiteralPath (Join-Path $results 'replica-stream.trx')
          $counts = $trx.TestRun.ResultSummary.Counters
          if ($counts.total -ne '1' -or $counts.executed -ne '1' -or $counts.passed -ne '1') {
            throw 'REPLICA_STREAM_PROBE_EXPECTED_EXACTLY_ONE_PASS'
          }

      - name: Run integral HU-035 recovery gate on native AMD64
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [Runtime.InteropServices.Architecture]::X64) {
            throw 'AMD64_HOST_REQUIRED: ubuntu-24.04 must resolve to an x64 runner.'
          }
          $imageRef = (docker image inspect --format '{{.Id}}' "sgol:$env:IMPLEMENTATION_SHA").Trim()
          ./scripts/operations/invoke-hu-035-amd64-gate.ps1 `
            -ImageRef $imageRef `
            -GateRoot (Join-Path $env:RUNNER_TEMP 'sgol-hu-035-amd64')

      - name: Preserve non-secret OCI, TECH-OPS and HU-035 evidence
        if: always() && github.event.pull_request.number != 58 && github.head_ref != 'codex/tech-e2e-cv-05'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-ops-${{ env.IMPLEMENTATION_SHA }}
          path: |
            ${{ runner.temp }}/sgol-oci-metadata.json
            ${{ runner.temp }}/sgol-${{ env.IMPLEMENTATION_SHA }}.oci.tar
            ${{ runner.temp }}/sgol-tech-ops-amd64/evidence-public/**
            ${{ runner.temp }}/sgol-hu-035-amd64/evidence-public/**
            ${{ runner.temp }}/sgol-replica-stream-public/replica-stream.trx
          if-no-files-found: warn
          compression-level: 0

      - name: TECH-E2E-CV-05 / integral hosted demo
        if: github.head_ref == 'codex/tech-e2e-cv-05'
        shell: pwsh
        run: |
          $imageId = (docker image inspect --format '{{.Id}}' "sgol:$env:IMPLEMENTATION_SHA").Trim()
          if ($LASTEXITCODE -ne 0 -or $imageId -cnotmatch '^sha256:[0-9a-f]{64}$') {
            throw 'CV05_OCI_IMAGE_MISSING'
          }
          $env:CV05_CI_IMAGE_ID = $imageId
          ./scripts/demo/run-cv05.ps1 -Mode Automated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate CV-05 original evidence and optional diagnostic inventory
        if: github.head_ref == 'codex/tech-e2e-cv-05'
        shell: pwsh
        run: ./scripts/ci/validate-cv05-evidence.ps1 -RunnerTemp $env:RUNNER_TEMP -ReportDirectory '.artifacts/cv05/latest' -ExpectedSha $env:IMPLEMENTATION_SHA

      - name: Preserve original CV-04 reports for CV-05
        if: success() && github.head_ref == 'codex/tech-e2e-cv-05'
        id: cv05_cv04_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-e2e-cv-04-${{ env.IMPLEMENTATION_SHA }}
          path: .artifacts/cv04/latest/**
          if-no-files-found: error
          retention-days: 14

      - name: Preserve original OCI and operations evidence for CV-05
        if: success() && github.head_ref == 'codex/tech-e2e-cv-05'
        id: cv05_tech_ops_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-ops-${{ env.IMPLEMENTATION_SHA }}
          path: |
            ${{ runner.temp }}/sgol-oci-metadata.json
            ${{ runner.temp }}/sgol-${{ env.IMPLEMENTATION_SHA }}.oci.tar
            ${{ runner.temp }}/sgol-tech-ops-amd64/evidence-public/**
            ${{ runner.temp }}/sgol-hu-035-amd64/evidence-public/**
            ${{ runner.temp }}/sgol-replica-stream-public/replica-stream.trx
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve original CV-05 reports and inventory
        if: success() && github.head_ref == 'codex/tech-e2e-cv-05'
        id: cv05_report_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-e2e-cv-05-${{ env.IMPLEMENTATION_SHA }}
          path: .artifacts/cv05/latest/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact SHA, digest and 14-day retention of CV-05 artifacts
        if: success() && github.head_ref == 'codex/tech-e2e-cv-05'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CV04_ID: ${{ steps.cv05_cv04_artifact.outputs.artifact-id }}
          CV04_DIGEST: ${{ steps.cv05_cv04_artifact.outputs.artifact-digest }}
          TECH_OPS_ID: ${{ steps.cv05_tech_ops_artifact.outputs.artifact-id }}
          TECH_OPS_DIGEST: ${{ steps.cv05_tech_ops_artifact.outputs.artifact-digest }}
          CV05_ID: ${{ steps.cv05_report_artifact.outputs.artifact-id }}
          CV05_DIGEST: ${{ steps.cv05_report_artifact.outputs.artifact-digest }}
        run: |
          ./scripts/ci/verify-cv05-artifacts.ps1 -Repository $env:GITHUB_REPOSITORY `
            -RunId ([long]$env:GITHUB_RUN_ID) -HeadSha $env:IMPLEMENTATION_SHA `
            -Cv04Id $env:CV04_ID -Cv04Digest $env:CV04_DIGEST `
            -TechOpsId $env:TECH_OPS_ID -TechOpsDigest $env:TECH_OPS_DIGEST `
            -Cv05Id $env:CV05_ID -Cv05Digest $env:CV05_DIGEST

      - name: Publish CV-04 operational digests in free run summary and log
        if: success() && github.event.pull_request.number == 58
        shell: pwsh
        run: ./scripts/ci/publish-cv04-operational-digests.ps1 -RunnerTemp $env:RUNNER_TEMP -ExpectedSha $env:IMPLEMENTATION_SHA

  hu035-network-ab:
    if: github.event_name == 'workflow_dispatch'
    name: HU-035 / isolated network A-B experiment (not acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: hu035-network-ab-manual
      cancel-in-progress: false
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout dispatched revision without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact SHA and native Linux AMD64 before build
        shell: pwsh
        run: ./scripts/operations/invoke-hu-035-replica-network-ab.ps1 -ExpectedSha $env:EXPECTED_SHA -ValidateOnly
      - name: Set up pinned SDK for focused experiment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Build only the experiment test project and its dependencies
        shell: bash
        run: |
          test "$(dotnet --version)" = '10.0.400'
          dotnet restore tests/Sgol.OperationsIntegrationTests/Sgol.OperationsIntegrationTests.csproj --locked-mode -p:SGOL_TECH_OPS_PROVISIONING_TESTS=true -p:SGOL_HU035_AMD64_TESTS=true
          dotnet build tests/Sgol.OperationsIntegrationTests/Sgol.OperationsIntegrationTests.csproj --no-restore --configuration Release -p:SGOL_TECH_OPS_PROVISIONING_TESTS=true -p:SGOL_HU035_AMD64_TESTS=true
      - name: Build one local image shared by both variants
        shell: bash
        run: |
          created="$(git show -s --format=%cI HEAD)"
          docker build --platform linux/amd64 \
            --build-arg "VCS_REF=$EXPECTED_SHA" \
            --build-arg "IMAGE_VERSION=ab-${EXPECTED_SHA:0:12}" \
            --build-arg "BUILD_CREATED=$created" \
            --build-arg 'SOURCE_DIRTY=false' \
            --tag "sgol-ab:$EXPECTED_SHA" .
      - name: Run A then B with isolated cleanup and exact manifest acceptance
        shell: pwsh
        run: |
          $imageRef = (docker image inspect --format '{{.Id}}' "sgol-ab:$env:EXPECTED_SHA").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'AB_IMAGE_INSPECTION_FAILED' }
          ./scripts/operations/invoke-hu-035-replica-network-ab.ps1 -ExpectedSha $env:EXPECTED_SHA -ImageRef $imageRef -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sgol-network-ab')
      - name: Preserve only sanitized experiment results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hu035-network-ab-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sgol-network-ab/public/network-ab-summary.json
            ${{ runner.temp }}/sgol-network-ab/public/A-result.json
            ${{ runner.temp }}/sgol-network-ab/public/B-result.json
            ${{ runner.temp }}/sgol-network-ab/public/A.trx
            ${{ runner.temp }}/sgol-network-ab/public/B.trx
          if-no-files-found: warn
