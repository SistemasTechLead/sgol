name: Pull request gates

on:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  verify:
    name: TECH-BASE-003 / PR gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect Fuentes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Fuentes/; then
            echo "::error::Fuentes/ is protected and must not change in a pull request."
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- Fuentes/
            exit 1
          fi
          echo "PASS: Fuentes/ has no changes in this pull request."

      - name: Scan secrets with pinned Gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --no-color .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify the .NET SDK version
        shell: bash
        run: |
          actual_version="$(dotnet --version)"
          if [[ "$actual_version" != "10.0.400" ]]; then
            echo "::error::Expected .NET SDK 10.0.400, found ${actual_version}."
            exit 1
          fi
          echo "PASS: .NET SDK ${actual_version}."

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Build Release with static analysis
        run: dotnet build --no-restore --configuration Release

      - name: Run unit, architecture and PostgreSQL integration tests
        run: dotnet test --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Reject vulnerable direct or transitive packages
        shell: pwsh
        run: ./scripts/ci/Assert-NoVulnerablePackages.ps1
